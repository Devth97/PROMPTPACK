<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Who animated us? | Juno and Pixel</title>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.module.js" } }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1220; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Montserrat, system-ui, sans-serif; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #captions { position: absolute; left: 70px; right: 70px; top: 1330px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
      #speaker { font-size: 26px; font-weight: 900; letter-spacing: 0.18em; padding: 6px 16px; border: 3px solid #0b0b0f; box-shadow: 4px 4px 0 #0b0b0f; color: #0b0b0f; background: #a8f0c6; }
      #speaker[data-who="pixel"] { background: #ff6a2a; }
      #line { font-size: 66px; line-height: 1.12; font-weight: 900; color: #fffbf2; letter-spacing: -0.01em; text-shadow: 0 4px 0 #0b0b0f, 0 0 24px rgba(11, 11, 15, 0.85); max-width: 940px; }
      #line .w { opacity: 0.45; }
      #line .w.on { opacity: 1; }
      #line .w.now { color: #ffe14d; }
      #endcard { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 260px; gap: 18px; opacity: 0; }
      #endcard .kicker { font-size: 30px; font-weight: 900; letter-spacing: 0.2em; color: #a8f0c6; }
      #endcard .title { font-size: 92px; line-height: 0.95; font-weight: 900; color: #fffbf2; text-align: center; text-transform: uppercase; text-shadow: 0 6px 0 #0b0b0f; }
      #endcard .brand { font-size: 34px; font-weight: 900; color: #0b0b0f; background: #ffe14d; border: 3px solid #0b0b0f; box-shadow: 5px 5px 0 #0b0b0f; padding: 8px 20px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-no-timeline data-start="0" data-duration="46.25" data-width="1080" data-height="1920">
      <canvas id="stage" width="1080" height="1920"></canvas>
      <audio id="dialogue" src="assets/voice/dialogue.wav" data-start="0" data-duration="46.25" data-volume="1"></audio>
      <audio id="music" src="assets/music/bed.wav" data-start="0" data-duration="46.25" data-volume="0.16"></audio>
      <div id="captions"><div id="speaker"></div><div id="line"></div></div>
      <div id="endcard"><div class="kicker">MADE ENTIRELY IN CODE</div><div class="title">Motion Briefs for Code</div><div class="brand">PROMPTPACK</div></div>
    </div>

    <script type="module" src="./assets/scene.js"></script>
  </body>
</html>

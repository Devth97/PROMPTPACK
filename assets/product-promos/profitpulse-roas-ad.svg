<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t"><title id="t">ProfitPulse before you scale ads fix your numbers</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f9fefa"/><stop offset="1" stop-color="#e5f5f0"/></linearGradient><linearGradient id="ink" x2="1"><stop stop-color="#11283e"/><stop offset="1" stop-color="#066d65"/></linearGradient><linearGradient id="teal" x2="1"><stop stop-color="#06776d"/><stop offset="1" stop-color="#14b7a4"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0b3442" flood-opacity=".13"/></filter></defs><rect width="1080" height="1350" fill="#f6faf9"/><circle cx="1042" cy="-12" r="270" fill="#ddf5eb"/><text x="78" y="93" font-family="Arial,sans-serif" font-size="30" fill="#087b71" font-weight="900">PROMPTPACK / PROFITPULSE</text><text x="78" y="228" font-family="Arial,sans-serif" font-size="78" fill="#142e40" font-weight="900">Before you scale</text><text x="78" y="321" font-family="Arial,sans-serif" font-size="82" fill="#097b6e" font-weight="900">your Meta ads,</text><text x="78" y="418" font-family="Arial,sans-serif" font-size="82" fill="#142e40" font-weight="900">fix your numbers.</text><text x="81" y="482" font-family="Arial,sans-serif" font-size="28" fill="#48636b">Break-even ROAS is different from reported ROAS.</text><rect x="80" y="547" width="922" height="508" rx="28" fill="white" filter="url(#shadow)"/><rect x="80" y="547" width="922" height="77" rx="28" fill="#142f42"/><rect x="80" y="594" width="922" height="30" fill="#142f42"/><text x="118" y="597" font-size="32" font-family="Arial,sans-serif" font-weight="800" fill="white">Example · profit math</text><g font-family="Arial,sans-serif"><text x="119" y="686" font-size="28" fill="#36515c">Selling price</text><text x="953" y="686" font-size="32" fill="#142f42" text-anchor="end" font-weight="800">₹1,499</text><path d="M119 710 H956" stroke="#dfebe6" stroke-width="2"/><text x="119" y="769" font-size="28" fill="#36515c">Product + shipping + fees</text><text x="953" y="769" font-size="32" fill="#142f42" text-anchor="end" font-weight="800">₹920</text><path d="M119 792 H956" stroke="#dfebe6" stroke-width="2"/><text x="119" y="851" font-size="28" fill="#36515c">Target ad cost per order</text><text x="953" y="851" font-size="32" fill="#142f42" text-anchor="end" font-weight="800">₹350</text><path d="M119 871 H956" stroke="#dfebe6" stroke-width="2"/><text x="119" y="942" font-size="30" fill="#08776a" font-weight="900">Contribution after ads*</text><text x="953" y="942" font-size="56" fill="#08776a" text-anchor="end" font-weight="900">₹229</text><text x="119" y="1010" font-size="20" fill="#667d82">*Example excludes tax, returns, RTO &amp; fixed costs.</text></g><rect x="80" y="1082" width="922" height="96" rx="24" fill="#e3f5ee"/><text x="541" y="1141" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#0c655a">Excel toolkit + guide + 12 AI prompts</text><rect x="80" y="1210" width="922" height="102" rx="29" fill="#0a766a"/><text x="541" y="1275" text-anchor="middle" font-family="Arial,sans-serif" font-size="41" font-weight="900" fill="white">Try the free calculator →</text></svg>